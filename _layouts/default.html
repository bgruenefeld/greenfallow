<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="shortcut icon" href="{{ "/favicon.ico" | relative_url }}">
    <link rel="stylesheet" href="/assets/css/style.css"><link type="application/atom+xml" rel="alternate" href="https://greenfallow.de/feed.xml" title="greenfallow labradors" /><!-- Google tag (gtag.js) -->
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css">
    <style>
        #lightbox #next {
          color: black !important;
        }
        #lightbox #prev {
          color: black !important;
        }
        #lightbox #close {
          background: #111 !important;
        }
        
        #lightbox{
          background-color: #fcfff5 !important;
        }
        .wrapper {
          max-width: calc(1000px - (30px * 2));
          padding-right: 30px;
          padding-left: 30px;
        }
       a {
          /* color: #2a7ae2; */
          text-decoration: underline;
      }
         main.page-content{
            margin-top: 2.5%;
            background-color: #fcfff5;
            -webkit-user-select: text;
            -webkit-touch-callout: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
          }
        @media (max-width: 500px) {
          main.page-content{
            margin-top: 10.5%;
            
          }
        }
        .b-light b {
          font-weight: 400;
          text-decoration: underline;
        }
        main.page-content b{
          font-weight: 400;
          text-decoration: underline;
        }
        main.page-content a{
          user-select: all;
        }
        header.site-header {
          position: fixed;
          width: 100%;
          background-color: #ddf3af;
          z-index: 10;
        }
        footer.site-footer{
          background-color: #ddf3af;
          padding:10px;
          max-height: 55.95px;
        }
      </style>
  </head>
  <body>
    <header class="site-header" role="banner">
      <div class="wrapper">
        <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
        
        <!-- 👇 Deine feste Navigation -->
        <nav class="site-nav">
          <ul class="page-link">
            <li><a class="page-link" href="{{ '/' | relative_url }}">Start</a></li>
            <li><a class="page-link" href="{{ '/dogs/' | relative_url }}">Hunde</a></li>
            <li><a class="page-link" href="{{ '/breedingplan/' | relative_url }}">Zuchtplan</a></li>
            <li><a class="page-link" href="{{ '/litters/' | relative_url }}">Würfe</a></li>
            <li><a class="page-link" href="{{ '/posts.html' | relative_url }}">Blog</a></li>
            <li><a class="page-link" href="{{ '/about/' | relative_url }}">Über mich</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. Powered by <a href="https://jekyllrb.com">Jekyll</a>.</p>
      </div>
    </footer>
  </body>
</html>
